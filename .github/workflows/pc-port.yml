name: PC port build

on:
  push:
    branches: [pc-port]
  pull_request:
    branches: [pc-port]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.100.0

jobs:
  build:
    name: Build without the baserom
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install tools
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          brew install ninja

      - name: Get reality64 revision
        id: reality64
        run: echo "sha=$(git rev-parse HEAD:reality64)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo target
        uses: actions/cache@v6
        with:
          path: build-cmake/cargo
          key: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('reality64/Cargo.lock') }}-${{ steps.reality64.outputs.sha }}
          restore-keys: cargo-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('reality64/Cargo.lock') }}-

      - name: Build
        run: |
          cmake -S . -B build-cmake -GNinja -DSM64_ASSET_STUBS=ON
          cmake --build build-cmake
